[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcetrace"
version = "0.2.0"
description = "Check that a report's quotations and numbers really come from its sources."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.scripts]
sourcetrace = "sourcetrace.cli:main"

[tool.setuptools]
packages = ["sourcetrace"]
